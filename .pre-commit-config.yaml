# Run with prek (`uvx prek run --all-files`) or pre-commit.
# Diagrams are generated files (draw.io exports); leave their whitespace alone.
exclude: \.(svg|drawio)$
# `prek install` also installs the commit-msg hook (default_install_hook_types).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, pre-merge-commit, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
        # helper module that the integration tests import, not a test file
        exclude: ^tests/tutorial_pipeline\.py$
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # notebooks are excluded via extend-exclude in pyproject.toml
      - id: ruff-check
        args: ["--fix", "--show-fixes"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.22
    hooks:
      - id: uv-lock

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject

  - repo: local
    hooks:
      # One spelling for AI attribution, so `git log --grep='^Assisted-by: '`
      # finds every AI-assisted commit: `Assisted-by: <Harness>:<model>`,
      # e.g. `Assisted-by: ClaudeCode:claude-opus-5-5` or
      # `Assisted-by: OpenCode:Kimi-K2.6`. Each pattern below is a spelling to
      # reject; a commit message line matching any of them fails the hook.
      - id: ai-trailer
        name: 'AI trailer is "Assisted-by: <Harness>:<model>"'
        language: pygrep
        entry: |
          (?x)^(?:
            # Assisted-by in any other shape: other key case, no space after
            # the colon, a space inside the harness or model, missing parts.
            (?!Assisted-by:\ [A-Za-z][A-Za-z0-9.-]*:\S+$)(?i:assisted[-_\ ]?by)\s*:
            # Claude Code is always the harness "ClaudeCode".
            | Assisted-by:\ (?!ClaudeCode:)(?i:[^:]*claude)
            # Claude models use the exact model id: claude-opus-5-5, not
            # claude-opus-5.5, Opus-5 or anthropic/claude-opus-5-5.
            | Assisted-by:\ [^:]+:(?!claude-[a-z]+(?:-[0-9]+)+$)(?i:.*(?:claude|opus|sonnet|haiku|fable))
            # Claude is never listed as a co-author.
            | (?i:co-authored[-_\ ]?by)\s*:.*(?i:claude|anthropic)
          )
        stages: [commit-msg]
