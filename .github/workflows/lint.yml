name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the AI attribution check reads the commits since the base
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Run prek hooks
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Check AI attribution in the commits of the PR (or push)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # On PRs, HEAD is GitHub's synthetic merge commit; check up to the PR's tip.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/check_ai_attribution.py --since "$BASE" --head "$HEAD_SHA"
