# Dependabot configuration.
#
# Canonical template: BrainCOGS/U19-pipeline-python .github/dependabot.yml.
# Every ecosystem waits 7 days after a release (`cooldown`) before proposing
# it, matching the `exclude-newer = "7 days"` quarantine in pyproject.toml.
#
# No `pip` entry for docs/.docker/pip_requirements.txt: that image builds
# upstream DataJoint's mkdocs site and isn't used by BrainCOGS. Dependabot
# security updates still cover it without an entry here.

version: 2

updates:
  #
  # GitHub Actions
  #
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "ci"

    rebase-strategy: "auto"

    # A group without `applies-to` only batches scheduled version updates.
    # Security updates are grouped separately, so declare both or the
    # security fixes keep arriving as one PR per package.
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  #
  # Docker (devcontainer image and the docs build image)
  #
  - package-ecosystem: "docker"
    directories:
      - "/.devcontainer"
      - "/docs/.docker"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "docker"

    commit-message:
      prefix: "docker"

    rebase-strategy: "auto"

    # See the github-actions entry above: version and security updates are
    # grouped independently, so both need a group.
    groups:
      docker:
        applies-to: "version-updates"
        patterns:
          - "*"
      docker-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  #
  # Python / uv
  #
  - package-ecosystem: "uv"
    directory: "/"
    cooldown:
      default-days: 7

    schedule:
      interval: "monthly"
      day: "wednesday"
      time: "06:00"
      timezone: "UTC"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    commit-message:
      prefix: "deps"

    rebase-strategy: "auto"

    # See the github-actions entry above: version and security updates are
    # grouped independently, so both need a group.
    groups:
      python:
        applies-to: "version-updates"
        patterns:
          - "*"
      python-security:
        applies-to: "security-updates"
        patterns:
          - "*"

    ignore:
      # datajoint 2.x renamed its config file to datajoint.json and ignores the
      # dj_local_conf.json that the BrainCOGS repos ship, so a 2.x bump breaks
      # every deployment. pyproject.toml pins datajoint<2 for the same reason
      # (and because 2.x renamed dj.schema, which scan.py uses at import).
      # Remove once the datajoint 2.x migration lands.
      - dependency-name: "datajoint"
        versions:
          - ">=2.0"
      # datajoint <2.0 imports pkg_resources (plugin.py, pulled in by
      # connection.py on every `import datajoint`). setuptools 83.0.0 removed
      # pkg_resources outright and there is no installable replacement, so any
      # bump to >=82 makes `import datajoint` fail with ModuleNotFoundError.
      # Verified in tech_calendar_streamlit#110. Remove together with the
      # datajoint ignore above.
      - dependency-name: "setuptools"
        versions:
          - ">=82"
